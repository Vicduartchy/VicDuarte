name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar suíte de testes
        run: npm test

      - name: Listar testes que falharam
        if: failure()
        run: |
          python3 - <<'EOF'
          import json
          with open('test-results.json') as f:
              data = json.load(f)

          def walk(suites, prefix=''):
              for s in suites:
                  title = f"{prefix}{s.get('title','')}"
                  for spec in s.get('specs', []):
                      for t in spec.get('tests', []):
                          for r in t.get('results', []):
                              if r.get('status') != 'passed':
                                  err = ''
                                  for e in r.get('errors', []):
                                      err = e.get('message', '')[:500]
                                      break
                                  print(f"::error title={title} - {spec.get('title')}::{err}")
                  walk(s.get('suites', []), f"{title} > ")

          walk(data.get('suites', []))
          EOF

      - name: Publicar relatório HTML em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
